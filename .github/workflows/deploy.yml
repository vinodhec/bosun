# Manual deploy for Bosun (project mybosun-55015).
# Trigger from your phone: github.com/vinodhec/bosun → Actions → "Deploy" → Run workflow.
# Pick a scope from the dropdown; "everything" mirrors `npm run build && firebase deploy`.
#
# The only repo secret required is FIREBASE_TOKEN (a `firebase login:ci` token).
# The VITE_FIREBASE_* values below are public web config (they ship in the client
# bundle and security is enforced by Firestore/Storage rules), so they live inline.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to deploy
        type: choice
        default: everything
        options:
          - everything          # hosting + functions + rules + indexes
          - hosting             # SPA only
          - functions           # Cloud Functions only
          - rules               # firestore rules + indexes only

concurrency:
  group: deploy-bosun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve deploy targets
        id: targets
        run: |
          case "${{ inputs.scope }}" in
            everything) echo "only=hosting,functions,firestore:rules,firestore:indexes" >> "$GITHUB_OUTPUT" ;;
            hosting)    echo "only=hosting" >> "$GITHUB_OUTPUT" ;;
            functions)  echo "only=functions" >> "$GITHUB_OUTPUT" ;;
            rules)      echo "only=firestore:rules,firestore:indexes" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build SPA
        if: inputs.scope == 'everything' || inputs.scope == 'hosting'
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBCrM6y83hiSd9XJegR6YBOU12T0djCZH8
          VITE_FIREBASE_AUTH_DOMAIN: mybosun-55015.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mybosun-55015
          VITE_FIREBASE_STORAGE_BUCKET: mybosun-55015.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "396322771335"
          VITE_FIREBASE_APP_ID: 1:396322771335:web:bb238671f57f0e41e4c322
          VITE_FUNCTIONS_REGION: asia-south1
        run: |
          npm ci
          npm run build

      # gen2 functions discovery loads the code locally, so deps must be installed
      # before `firebase deploy --only functions` can detect the triggers.
      - name: Install functions deps
        if: inputs.scope == 'everything' || inputs.scope == 'functions'
        run: npm --prefix functions ci

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm i -g firebase-tools
          firebase deploy \
            --only "${{ steps.targets.outputs.only }}" \
            --project mybosun-55015 \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
