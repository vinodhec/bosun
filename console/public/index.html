<!doctype html><meta charset="utf-8"><title>Agent Console (local)</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e8ee;--dim:#8b93a7;--accent:#5b8cff}
  *{box-sizing:border-box} body{margin:0;height:100vh;display:flex;font:14px/1.5 ui-sans-serif,system-ui;background:var(--bg);color:var(--fg)}
  #left{width:42%;min-width:340px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  #right{flex:1;display:flex;flex-direction:column;background:#fff}
  header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:13px}
  #log{flex:1;overflow:auto;padding:14px;white-space:pre-wrap;word-break:break-word}
  .u{color:var(--accent);margin-top:14px;font-weight:600}
  .tool{color:var(--dim);font-size:12px}
  .ck{color:#6ee7a8;font-size:12px;border-top:1px dashed var(--line);padding-top:6px;margin-top:8px}
  .err{color:#ff8b8b}
  form{display:flex;border-top:1px solid var(--line)}
  textarea{flex:1;background:var(--panel);border:0;color:var(--fg);padding:12px;resize:none;height:64px;font:inherit;outline:none}
  button{background:var(--accent);border:0;color:#fff;padding:0 18px;cursor:pointer;font:inherit}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);padding:4px 10px;font-size:12px}
  iframe{flex:1;border:0;width:100%}
  #bar{height:3px;background:var(--line)} #bar>i{display:block;height:100%;background:var(--accent);width:0}
  #meta{margin-left:auto;color:var(--dim);font-size:12px}
</style>
<div id="left">
  <header>
    <b>Agent Console</b>
    <button class="ghost" id="new">New session</button>
    <button class="ghost" id="undo">Undo turn</button>
    <button class="ghost" id="ship">Ship</button>
    <span id="meta"></span>
  </header>
  <div id="bar"><i></i></div>
  <div id="log">Loopback fallback UI (LOCAL_UI=1). The real page is /admin/chat-code on the platform. Click <b>New session</b> — it branches from origin/main and boots a dev server.</div>
  <form id="f"><textarea id="p" placeholder="Describe the change…  (Enter to send, Shift+Enter for newline)"></textarea><button>Send</button></form>
</div>
<div id="right"><iframe id="pv" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe></div>
<script>
const API='/__console/api/';
const log=document.getElementById('log'),meta=document.getElementById('meta'),bar=document.querySelector('#bar>i');
let S=null,es=null,busy=false,stream=null;
const add=(t,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d};
const call=(op,body,method)=>fetch(API+op,{method:method||'POST',headers:{'content-type':'application/json',authorization:'Bearer '+S.token},body:body?JSON.stringify(body):undefined}).then(r=>r.json());
function ev(e){
  const m=JSON.parse(e.data);
  if(m.t==='text'){ if(!stream)stream=add(''); stream.textContent+=m.v; log.scrollTop=log.scrollHeight; }
  else if(m.t==='tool') add('· '+m.v+(m.f?'  '+m.f:''),'tool');
  else if(m.t==='preview'){ document.getElementById('pv').src=S.previewPath; add('preview ready','tool'); }
  else if(m.t==='checkpoint'){ stream=null; add(`checkpoint ${m.n} @${m.sha}  ${m.stat||'no changes'}`,'ck'); }
  else if(m.t==='quota'){ const f=Math.round((m.five||0)*100),s=Math.round((m.seven||0)*100);
    meta.textContent=`quota 5h ${f}% · 7d ${s}%`; bar.style.width=f+'%'; bar.style.background=f>85?'#ff6b6b':'#5b8cff'; }
  else if(m.t==='undo'){ stream=null; add('reverted to '+m.to,'ck'); }
  else if(m.t==='shipped') add('shipped → '+m.url,'ck');
  else if(m.t==='idle'){ busy=false; stream=null; }
  else if(m.t==='result'&&m.err) add('turn ended with an error: '+(m.v||''),'err');
  else if(m.t==='error'||m.t==='stderr') add(m.v,'err');
}
document.getElementById('new').onclick=async()=>{
  log.textContent=''; add('creating worktree from origin/main…','tool');
  const r=await(await fetch(API+'session',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})).json();
  if(r.error)return add(r.error==='busy'?`busy: a session has been live since ${new Date(r.since).toLocaleTimeString()}`:r.error,'err');
  S=r; add('branch '+r.branch,'tool');
  es&&es.close(); es=new EventSource(API+'events?token='+S.token); es.onmessage=ev;
};
document.getElementById('undo').onclick=async()=>{ if(S) await call('undo',{back:1}); };
document.getElementById('ship').onclick=async()=>{ if(!S)return; const r=await call('ship',{}); if(r.error)add(r.error,'err'); };
document.getElementById('f').onsubmit=async(e)=>{
  e.preventDefault(); const p=document.getElementById('p');
  if(!S)return add('start a session first','err'); if(busy)return add('a turn is still running','err');
  if(!p.value.trim())return; busy=true; add('› '+p.value,'u');
  await call('turn',{prompt:p.value});
  p.value='';
};
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('f').requestSubmit();}});
</script>
